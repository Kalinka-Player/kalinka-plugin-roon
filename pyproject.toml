[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalinka-plugin-roon"
version = "0.1.1"
description = "Roon Bridge endpoint and now-playing integration for Kalinka"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["kalinka-plugin-sdk>=3.7,<4", "httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff", "build"]

[project.urls]
Repository = "https://github.com/Kalinka-Player/kalinka-plugin-roon"

[project.entry-points."kalinka.plugins"]
kalinka_plugin_roon = "kalinka_plugin_roon:KalinkaPluginRoon"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kalinka_plugin_roon = ["extension/*.js", "extension/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
