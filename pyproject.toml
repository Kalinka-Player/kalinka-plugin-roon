[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "kalinka-plugin-roon"
dynamic = ["version"]
description = "Roon Bridge endpoint and now-playing integration for Kalinka"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["kalinka-plugin-sdk>=3.7,<4", "httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff", "build", "setuptools-scm>=8"]

[project.urls]
Repository = "https://github.com/Kalinka-Player/kalinka-plugin-roon"

[project.entry-points."kalinka.plugins"]
kalinka_plugin_roon = "kalinka_plugin_roon:KalinkaPluginRoon"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kalinka_plugin_roon = ["extension/*.js", "extension/*.json"]

[tool.setuptools_scm]
tag_regex = "^kalinka-plugin-roon-v(?P<version>\\d+\\.\\d+\\.\\d+)$"
git_describe_command = "git describe --dirty --tags --long --match kalinka-plugin-roon-v*"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
# No fallback_version on purpose: a build that cannot read git metadata
# must fail, not silently produce a mislabelled wheel.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
